name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar bibliotecas
        run: python -m pip install pymupdf python-docx lxml beautifulsoup4
      - name: Autoteste da varredura (12 técnicas)
        run: python plugin/skills/deteccao-prompt-injection/scripts/testar_varredura.py
      - name: Teste de ponta a ponta do hook do plugin
        run: python testes/testar_hook.py
      - name: Manifestos JSON válidos
        run: python -c "import json; [json.load(open(p, encoding='utf-8')) for p in ['.claude-plugin/marketplace.json', 'plugin/.claude-plugin/plugin.json', 'plugin/hooks/hooks.json']]; print('ok')"
